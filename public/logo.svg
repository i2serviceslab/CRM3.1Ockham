<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" className="w-auto h-full">
  <defs>
    <linearGradient id="silver-face-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="silver-face-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="silver-face-3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>
  
  <!-- Outer Metallic Circle Arc -->
  <path d="M 40,8 A 32,32 0 1,1 12,48" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 10,34 A 32,32 0 0,1 36,9" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- 3D Pyramid Prism Emblem (Outcrop Silver Icon) -->
  <!-- Top Face -->
  <polygon points="42,12 8,42 36,36" fill="url(#silver-face-1)" />
  <!-- Bottom Right Face -->
  <polygon points="42,12 36,36 34,68" fill="url(#silver-face-2)" />
  <!-- Bottom Left Face -->
  <polygon points="8,42 36,36 34,68" fill="url(#silver-face-3)" />

  <!-- Outcrop Silver Vector Text (Pure White #ffffff) -->
  <text x="80" y="36" font-family="'Urbanist', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" letter-spacing="4" fill="#ffffff">
    OUTCROP
  </text>
  <text x="80" y="58" font-family="'Urbanist', 'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" letter-spacing="7" fill="#e2e8f0" opacity="0.9">
    SILVER
  </text>
</svg>
